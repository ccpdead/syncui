name: sync_ui
channels:
  - conda-forge
dependencies:
  - rust>=1.77
  - nodejs>=20
  - pkg-config
  - c-compiler
  - cxx-compiler
  - make
  # Tauri (Linux) WebView / GUI runtime deps from conda-forge so the host stays clean.
  # webkit2gtk4.1 pulls in gtk3, libsoup3, librsvg, etc. as dependencies.
  - webkit2gtk4.1
  - librsvg
  - openssl
  - zlib
