[package]
# Debian Package name follows this crate name. Must NOT be "sync-ui" —
# that name is taken by Ubuntu's SyncEvolution GUI (universe/sync-ui),
# and apt will "upgrade" our 0.1.0 back to their 2.0.0-3 overnight.
name = "syncui"
version = "0.1.0"
description = "Cross-platform directory sync GUI"
authors = ["you"]
edition = "2021"

[lib]
name = "sync_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
filetime = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

# Build scripts / proc-macros don't need aggressive opts; full LTO + codegen-units=1
# on them easily OOMs when cargo parallelizes across many cores.
[profile.release.build-override]
opt-level = 0
codegen-units = 256
