[package]
# The Debian package name is derived from Tauri's productName (kebab-cased),
# not from this crate name. tauri.linux.conf.json overrides productName to
# "syncui": "SyncUI" would become "sync-ui", which is Ubuntu's SyncEvolution
# GUI (universe/sync-ui), and unattended-upgrades would replace our 0.1.0
# with their 2.0.0-3 overnight.
name = "syncui"
version = "0.2.3"
description = "Cross-platform directory sync GUI"
authors = ["you"]
edition = "2021"

[lib]
name = "sync_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sync-core = { path = "../crates/sync-core" }
libc = "0.2"
sha2 = "0.10"
flate2 = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
filetime = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

# Build scripts / proc-macros don't need aggressive opts; full LTO + codegen-units=1
# on them easily OOMs when cargo parallelizes across many cores.
[profile.release.build-override]
opt-level = 0
codegen-units = 256

[features]
integration-test = []

[[example]]
name = "ssh_smoke"
required-features = ["integration-test"]
